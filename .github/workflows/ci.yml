name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: degems_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d degems_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/degems_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/degems_test_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: docker build --tag degems-api:ci --file apps/api/Dockerfile .
      - run: docker build --build-arg APP_NAME=admin --build-arg BACKEND_API_URL=https://api.example.invalid --tag degems-admin:ci --file Dockerfile.ui .
      - run: docker build --build-arg APP_NAME=storefront --build-arg BACKEND_API_URL=https://api.example.invalid --tag degems-storefront:ci --file Dockerfile.ui .
