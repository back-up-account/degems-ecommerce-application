global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: degems-api
    metrics_path: /api/metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['api:3000']
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
